# The web app: its built files, the book covers (a volume, so covers saved after the image was
# built show), the API under /api (as the Vite dev server's proxy passes it: /api/books -> the
# API's /books), and index.html for every other path, which the app routes itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the trailing slash drops the /api prefix
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # page insights wait on an OpenRouter request
        proxy_read_timeout 120s;
    }

    location /covers/ {
        expires 7d;
        try_files $uri =404;
    }

    # Vite's hashed bundles never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # always the latest app
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
