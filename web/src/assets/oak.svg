<!-- Dark grey oak grain, generated with SVG noise filters; tiles seamlessly (stitchTiles). Used by .home in app.scss -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <filter id="oak" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- long grain: noise stretched along x -->
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.035" numOctaves="5" seed="11" stitchTiles="stitch" result="grain"/>
    <!-- growth rings: band the grain into thin wavy lines -->
    <feComponentTransfer in="grain" result="rings">
      <feFuncR type="table" tableValues="0 1 0.2 0.9 0.1 1 0.3 0.8 0 1 0.2 0.9 0.1 1 0.3 0.8 0"/>
    </feComponentTransfer>
    <!-- open oak pores: fine streaks -->
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="pores"/>
    <feComposite in="rings" in2="pores" operator="arithmetic" k2="0.65" k3="0.4" result="wood"/>
    <!-- dark grey, barely warm -->
    <feColorMatrix in="wood" type="matrix" values="
      0.19 0 0 0 0.080
      0.185 0 0 0 0.078
      0.18 0 0 0 0.078
      0    0 0 0 1"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#oak)"/>
</svg>
