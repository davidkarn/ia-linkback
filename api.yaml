openapi: '3.1.0'
servers:
  - url: telalucis.org
info:
  contact:
    name: David
  version: '1.0.0'
  title: 'cititations api'
  description: backend for citations browsing and querying

paths:
  /books:
    get:
      tags: 
        - Books
      description: get list of books
      parameters:
       - name: offset
         in: query
         required: false
         schema:
            type: number
            minimum: 0
            maximum: 10000
       - name: length
         in: query
         required: false
         schema:
           type: number
           minimum: 1
           maximum: 100
       - name: query
         description: >-
           search title and author. Books whose latest copyright status check finds them
           likely_copyrighted are never listed.
         in: query
         required: false
         schema:
          type: string      
       - name: authorId
         description: only the books of this author (an id from GET /authors)
         in: query
         required: false
         schema:
          type: string
          pattern: '^[1-9][0-9]*$'
      summary: Search books
      responses:
        '200':
          description: books list
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookSummary'
  /authors:
    get:
      tags:
        - Authors
      summary: A page of the authors with books in the collection, by name
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 10000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
        - name: query
          description: >-
            only authors going by a name containing this, ignoring case: their own or another of
            theirs (alternate_author_names: "Aquinas", "The Philosopher")
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: a page of authors, and meta.count, how many there are in all
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorSummary'
  /authors/{authorId}:
    get:
      tags:
        - Authors
      summary: An author with books in the collection
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorSummary'
        '404':
          description: no author with that id has a book in the collection
  /books/{bookId}:
    get:
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: volume
          description: >-
            the volume to open (1-based, see volumes). A book whose pages are not cited by parts
            has only volume 1, the whole book.
          in: query
          required: false
          schema:
            type: number
            minimum: 1
        - name: pageId
          description: >-
            without volume: open the first volume holding this page (volume 1 when none does)
          in: query
          required: false
          schema:
            type: number
            minimum: 1
      summary: >-
        Get a book's summary opened to one of its volumes (volume 1 when neither volume nor pageId
        is given), with that volume's pages in order under pageOrder and its table of contents
        under contents.
      responses:
        '200':
          description: book summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSummary'
        '404':
          description: no book with this id, or no such volume
  /books/{bookId}/pageOrder:
    get:
      tags:
        - Books
      summary: >-
        The book's pageOrder with each page's citations counted, replacing the placeholder in
        GET /books/{bookId} (whose citedByCounts are null: counting them is slow)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: volume
          description: the volume opened, as for GET /books/{bookId}
          in: query
          required: false
          schema:
            type: number
            minimum: 1
        - name: pageId
          description: without volume, open the first volume holding this page, as for GET /books/{bookId}
          in: query
          required: false
          schema:
            type: number
            minimum: 1
      responses:
        '200':
          description: the volume opened and its pageOrder
          content:
            application/json:
              schema:
                type: object
                required: [volume, pageOrder, allPagesListed]
                properties:
                  volume:
                    type: number
                  pageOrder:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageOrderEntry'
                  allPagesListed:
                    description: as in GET /books/{bookId}
                    type: boolean
        '404':
          description: no such book or volume
        '451':
          description: the book is withheld, likely still under copyright
  /books/{bookId}/pages/{pageId}:
    get:
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          description: a pageId from the book's pageOrder
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      summary: >-
        Get one page of a book, with the citations in other books that point to it (without the
        text of the pages they are on: GET /citations/{citationId}/sourcePage).
      responses:
        '200':
          description: book page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '404':
          description: no such book or page
  /books/{bookId}/pages/{pageId}/insights:
    get:
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          description: a pageId from the book's pageOrder
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      summary: >-
        What other books in the collection say about this page: an LLM summary of the passages
        that cite it (each citing page with two pages before and after), with this page as context.
        The result is cached per page until a citation is newly linked to the page.
      responses:
        '200':
          description: the insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInsights'
        '204':
          description: nothing in the collection cites this page (no summary is made)
        '404':
          description: no such book or page
        '502':
          description: the OpenRouter request failed
        '503':
          description: insights are unavailable (OPENROUTER_KEY is not set)
  /citations/{citationId}/sourcePage:
    get:
      tags:
        - Citations
      parameters:
        - name: citationId
          description: a Citation's id
          in: path
          required: true
          schema:
            type: string
      summary: >-
        Get the HTML of the page a citation's footnote is on, to show beside the page it cites
        (fetched when the citation is expanded, rather than with GET /books/{bookId}/pages/{pageId}).
      responses:
        '200':
          description: the citing page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationSourcePage'
        '400':
          description: citationId is not an id
        '404':
          description: no citation with this id
  /books/{bookId}/citationsTo:
    get:
      tags:
        - Citations
      parameters:
        - name: offset
          in: query
          required: false
          schema:
             type: number
             minimum: 0
             maximum: 10000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
        - name: bookId
          in: path
          required: true
          schema:
            type: number
      summary: >-
        Get other books that cite this one: citations pointing at it or at one of its alternate ids
        (the alternate_ids table).
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Citation'
  /admin/session:
    get:
      tags:
        - Admin
      summary: Whether this browser is signed in to the admin panel (its session cookie is valid).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/login:
    post:
      tags:
        - Admin
      summary: >-
        Sign in to the admin panel with ADMIN_USERNAME and ADMIN_PASSWORD (from the API's
        environment). Sets the tl_admin_session cookie (HttpOnly, SameSite=Strict), good for 7 days
        or until the password changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          description: wrong username or password
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/logout:
    post:
      tags:
        - Admin
      summary: Sign out of the admin panel, ending the session cookie.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
  /admin/dashboard:
    get:
      tags:
        - Admin
      summary: >-
        The import queue (queued_book_imports): how many books have each status, and the next books
        to be OCR'd. Needs the session cookie from POST /admin/login.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          description: not signed in
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/books:
    get:
      tags:
        - Admin
      summary: >-
        A page of all books with their citation counts. Needs the session cookie from
        POST /admin/login.
      parameters:
        - name: query
          description: only books whose title or author contains this, ignoring case
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: >-
            title (the default): by title; citationsFrom: by the citations in their footnotes, the
            most first; unmatchedFrom: by those of them not matched to a book, the most first
          in: query
          required: false
          schema:
            type: string
            enum:
              - title
              - citationsFrom
              - unmatchedFrom
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        description: how many books match, in all
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminBook'
        '400':
          description: sort, offset or length out of bounds
        '401':
          description: not signed in
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/queued-books:
    get:
      tags:
        - Admin
      summary: >-
        A page of the books queued for import (queued_book_imports). Needs the session cookie from
        POST /admin/login.
      parameters:
        - name: query
          description: only queued books whose title or author contains this, ignoring case
          in: query
          required: false
          schema:
            type: string
        - name: status
          description: only queued books with this status; all (the default) for every status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - pending
              - queued
              - inProgress
              - processingContents
              - imported
              - importedAndCrawled
              - complete
        - name: sort
          description: >-
            status (the default): by status in the order a book goes through them; created: by when
            they were queued, the latest first; updated: by when they last changed, the latest
            first. Then in queue order.
          in: query
          required: false
          schema:
            type: string
            enum:
              - status
              - created
              - updated
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        description: how many queued books match, in all
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminQueuedBook'
        '400':
          description: status, offset or length out of bounds
        '401':
          description: not signed in
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/citations:
    get:
      tags:
        - Admin
      summary: >-
        A page of all citations, by author then title (those with no author last). Needs the
        session cookie from POST /admin/login.
      parameters:
        - name: query
          description: only citations whose title, author or raw text contains this, ignoring case
          in: query
          required: false
          schema:
            type: string
        - name: sourceBookId
          description: only the citations in this book's footnotes
          in: query
          required: false
          schema:
            type: string
        - name: matched
          description: >-
            matched: only citations pointing at the book they cite (reference_book_id set);
            unmatched: only those not; all (the default): both
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - matched
              - unmatched
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 10000000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        description: how many citations match, in all
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCitation'
        '400':
          description: matched, offset or length out of bounds
        '401':
          description: not signed in
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
  /admin/copyright:
    get:
      tags:
        - Admin
      summary: >-
        A page of all books with their latest copyright status check. Needs the session cookie
        from POST /admin/login.
      parameters:
        - name: query
          description: only books whose title or author contains this, ignoring case
          in: query
          required: false
          schema:
            type: string
        - name: status
          description: >-
            all (the default); unchecked: books never checked; or a status: books whose latest
            check gives it
          in: query
          required: false
          schema:
            type: string
            enum: [all, unchecked, likely_public_domain, probably_public_domain, doubtful_public_domain, likely_copyrighted]
        - name: sort
          description: >-
            title (the default); status: the most likely in the public domain first, those never
            checked last; checked: by when last checked, the latest first. Then by title.
          in: query
          required: false
          schema:
            type: string
            enum: [title, status, checked]
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100000
        - name: length
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: a page of books, and meta.count, how many there are in all
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      count:
                        type: number
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminBookCopyright'
        '401':
          description: not signed in
  /admin/copyright/{bookId}:
    post:
      tags:
        - Admin
      summary: >-
        Set a book's copyright status by hand: adds a check (manual) that is its latest. Needs the
        session cookie from POST /admin/login.
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [likely_public_domain, probably_public_domain, doubtful_public_domain, likely_copyrighted]
                notes:
                  type: string
      responses:
        '200':
          description: the book with its new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookCopyright'
        '400':
          description: no status, or not one of them
        '401':
          description: not signed in
        '404':
          description: no such book
  /admin/citation-insights:
    get:
      tags:
        - Admin
      summary: >-
        Every footnote extraction insight (footnote_extraction_insights) with its score, most widely
        applying first, then those not scored yet. Needs the session cookie from POST /admin/login.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationInsights'
        '401':
          description: not signed in
        '503':
          description: the admin panel is closed (ADMIN_USERNAME and ADMIN_PASSWORD are not set)
components:
  schemas:
    AdminBookCopyright:
      description: >-
        A book and its latest copyright status check; status, notes, manual and checkedAt are null
        when it was never checked. Books whose latest status is likely_copyrighted are left out of
        GET /books (shownInSearches false).
      type: object
      required: [bookId, title, author, status, notes, manual, checkedAt, shownInSearches]
      properties:
        bookId:
          type: string
        title:
          type: string
        author:
          type: string
        status:
          type: [string, 'null']
          enum: [likely_public_domain, probably_public_domain, doubtful_public_domain, likely_copyrighted, null]
        notes:
          type: [string, 'null']
        manual:
          description: set by hand in the admin panel, rather than judged by an LLM
          type: [boolean, 'null']
        checkedAt:
          type: [string, 'null']
          format: date-time
        shownInSearches:
          type: boolean
    AdminQueuedBook:
      type: object
      required:
        - id
        - title
        - author
        - status
        - archiveUrl
        - importedBookId
        - importedBookTitle
        - createdAt
        - updatedAt
      properties:
        id:
          description: its place in the queue
          type: string
        title:
          type: string
        author:
          type: string
        status:
          $ref: '#/components/schemas/QueueStatus'
        archiveUrl:
          type: [string, 'null']
        importedBookId:
          description: the book it was imported as, once it is
          type: [string, 'null']
        importedBookTitle:
          type: [string, 'null']
        createdAt:
          description: when it was queued (for those queued before this was kept, when it started)
          type: string
          format: date-time
        updatedAt:
          description: when it last changed (its status, most often)
          type: string
          format: date-time
    AdminBook:
      type: object
      required:
        - id
        - title
        - author
        - citationsTo
        - citationsFrom
        - unmatchedFrom
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        citationsTo:
          description: citations pointing at the book, or at one of its alternate ids
          type: number
        citationsFrom:
          description: citations in the book's own footnotes
          type: number
        unmatchedFrom:
          description: citations in the book's own footnotes not matched to the book they cite
          type: number
    AdminCitation:
      type: object
      required:
        - id
        - author
        - title
        - location
        - raw
        - sourceBookId
        - sourceBookTitle
        - sourceFootnotePage
        - referenceBookId
        - referenceBookTitle
      properties:
        id:
          type: string
        author:
          type: string
        title:
          type: string
        location:
          type: string
        raw:
          type: string
        sourceBookId:
          description: the book the citation is in
          type: string
        sourceBookTitle:
          type: [string, 'null']
        sourceFootnotePage:
          description: the citing page, a pageId of sourceBookId
          type: number
        referenceBookId:
          description: the book it cites, or an alternate id of one ("bible"); null when not matched
          type: [string, 'null']
        referenceBookTitle:
          description: null when not matched, or matched to an alternate id rather than a book
          type: [string, 'null']
    CitationInsights:
      type: object
      required:
        - maxPromptScore
        - insights
      properties:
        maxPromptScore:
          description: insights scored above this aren't given the model when extracting citations
          type: number
        insights:
          type: array
          items:
            type: object
            required:
              - id
              - insight
              - score
              - givenToModel
            properties:
              id:
                type: string
              insight:
                type: string
              score:
                description: >-
                  how widely it applies, 1 (citations seen in a wide number of texts) to 5 (very
                  obscure); null until scored
                type: [number, 'null']
              givenToModel:
                description: >-
                  whether it's given the model when extracting citations (scored up to
                  maxPromptScore, or not scored yet)
                type: boolean
    AdminSession:
      type: object
      required:
        - signedIn
      properties:
        signedIn:
          type: boolean
    QueueStatus:
      type: string
      enum:
        - pending
        - queued
        - inProgress
        - processingContents
        - imported
        - importedAndCrawled
        - complete
    AdminDashboard:
      type: object
      required:
        - statusCounts
        - nextUp
      properties:
        statusCounts:
          description: every status, in the order a book goes through them, with how many books have it
          type: array
          items:
            type: object
            required:
              - status
              - count
            properties:
              status:
                $ref: '#/components/schemas/QueueStatus'
              count:
                type: number
        nextUp:
          description: the first 10 books with status queued, the next to be OCR'd, in queue order
          type: array
          items:
            type: object
            required:
              - id
              - title
              - author
              - archiveUrl
              - pdfUrl
              - status
            properties:
              id:
                type: string
              title:
                type: string
              author:
                type: string
              archiveUrl:
                type: [string, 'null']
              pdfUrl:
                type: [string, 'null']
              status:
                $ref: '#/components/schemas/QueueStatus'
    BookPage:
      type: object
      properties:
        printedPageNumber:
          type: string
        pageNumber:
          type: number
        bookId:
          type: string
        foreignCitations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        foreignCitationTitles:
          description: the title and author of each book a citation in foreignCitations is in
          type: array
          items:
            type: object
            required:
              - bookId
              - title
              - author
            properties:
              bookId:
                type: string
              title:
                type: string
              author:
                type: string
        blocks:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              html:
                type: string
              citations:
                type: array
                items:
                  $ref: '#/components/schemas/Citation'
    PageInsights:
      type: object
      required:
        - bookId
        - pageId
        - printedPageNumber
        - overview
        - sources
      properties:
        bookId:
          type: string
        pageId:
          type: number
        printedPageNumber:
          type: string
        overview:
          description: how the citing sources, taken together, treat this page
          type: string
        sources:
          description: one per page in another book that cites this page, with what it says
          type: array
          items:
            type: object
            required:
              - bookId
              - title
              - author
              - pageId
              - printedPageNumber
              - footnoteIdentifiers
              - summary
            properties:
              bookId:
                type: string
              title:
                type: string
              author:
                type: string
              pageId:
                description: the citing page (a pageId of that book)
                type: number
              printedPageNumber:
                type: string
              footnoteIdentifiers:
                description: the footnote markers on that page that cite this page
                type: array
                items:
                  type: string
              summary:
                description: what that author says about this page ('' if the model gave none)
                type: string
    CitationSourcePage:
      description: the HTML of the page a citation's footnote is on
      type: object
      required:
        - citationId
        - sourcePageText
      properties:
        citationId:
          type: string
        sourcePageText:
          description: >-
            the citing page's blocks' HTML, in reading order, one per line, without running headers
            and footers and with only this citation's footnote
          type: string
    BookSummary:
      type: object
      required:
        - id
        - title
        - author
        - pageCount
        - citedByCount
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        url:
          type: string
        coverPhotoPath:
          description: cover image, relative to the frontend's root (e.g. covers/<id>.jpg)
          type: string
        pageCount:
          type: number
        citedByCount:
          description: >-
            number of citations in other books that reference this book, directly or through one of
            its alternate ids (the alternate_ids table)
          type: number
        allPagesListed:
          description: >-
            whether pageOrder lists every page of the book (GET /books/{bookId} only): true for a
            book without volumes, a short one (fewer than 200 pages; with an isVolume entry where
            each volume starts) or one whose volumes average fewer than 8 pages (without them);
            false when it lists only the open volume's
          type: boolean
        isBible:
          description: >-
            whether the book is a translation of the Bible (it has the alternate id "bible"), its
            pages a chapter each and its verses a block each (GET /books/{bookId} only)
          type: boolean
        volume:
          description: the volume opened (GET /books/{bookId} only)
          type: number
        volumes:
          description: >-
            the book's volumes (GET /books/{bookId} only): each distinct first citation part of
            its pages in book_pages_to_citations, in page order. Empty when it has none, when it is
            read as one volume 1.
          type: array
          items:
            $ref: '#/components/schemas/VolumeSummary'
        pageOrder:
          description: >-
            the pages of the volume opened, in order (GET /books/{bookId} only); for a book with
            volumes of fewer than 200 pages in all, every volume's pages, with an entry with isVolume
            true before each volume's first page; for one whose volumes average fewer than 8 pages,
            every page, without those entries (see allPagesListed). A placeholder: its citedByCounts
            are null, counted by GET /books/{bookId}/pageOrder, which replaces it
          type: array
          items:
            $ref: '#/components/schemas/PageOrderEntry'
        contents:
          description: >-
            the book's whole table of contents, from the parts its pages are cited by in
            book_pages_to_citations (e.g. book > question > article), every volume's entries (its
            top level, for a book with volumes); empty when it has none
          type: array
          items:
            $ref: '#/components/schemas/ContentsEntry'
    AuthorSummary:
      type: object
      required:
        - id
        - name
        - bookCount
        - citedByCount
      properties:
        id:
          type: string
        name:
          type: string
        bookCount:
          description: the author's books in the collection
          type: number
        citedByCount:
          description: >-
            citations in other books of any of the author's books, directly or through one of
            their alternate ids
          type: number
    PageOrderEntry:
      description: a page as pageOrder lists it, or where a volume starts (isVolume)
      type: object
      required: [pageId, printedPageNumber, citedByCount]
      properties:
        pageId:
          description: the page; for a volume's entry (isVolume), its first page
          type: number
        printedPageNumber:
          description: >-
            the number printed on the page; for a volume's entry, its label, or else its part
            ("Book 2")
          type: string
        citedByCount:
          description: >-
            number of citations in other books that reference this page (including those pointing
            at one of the book's alternate ids); null for a volume's entry, and in the placeholder
            pageOrder of GET /books/{bookId} (counted by GET /books/{bookId}/pageOrder)
          type: [number, 'null']
        isVolume:
          description: >-
            true for an entry that isn't a page but marks where a volume starts; absent for pages
          type: boolean
    VolumeSummary:
      type: object
      required:
        - volume
        - partType
        - partValue
        - firstPageId
        - lastPageId
        - pageCount
      properties:
        volume:
          description: the volume's number, 1-based
          type: number
        partType:
          description: the type of the first citation part making the volume (book, part, ...)
          type: string
        partValue:
          type: string
        firstPageId:
          description: >-
            the volume's first page. Pages not cited by parts belong to the volume before them (or
            the first volume); a page cited in two volumes is in both.
          type: number
        lastPageId:
          type: number
        pageCount:
          type: number
        label:
          description: >-
            the volume's proper name ("Isaias", "Prima Pars"), from book_part_names; absent when it
            has none
          type: string
    ContentsEntry:
      type: object
      required:
        - partType
        - partValue
        - pageId
        - printedPageNumber
        - childEntries
      properties:
        partType:
          description: a citation location type (book, chapter, question, article, ...)
          type: string
        partValue:
          type: string
        pageId:
          description: >-
            the page to go to for this entry (a pageId from pageOrder): the page cited by exactly
            this entry's parts, or else the first page under it. For a book with volumes, a page
            of the volume of the entry's top-level ancestor, which may not be the one opened.
          type: number
        printedPageNumber:
          description: the printed number of the page at pageId ('' when it has none)
          type: string
        label:
          description: >-
            the entry's proper name ("Isaias", "Prima Pars"), from book_part_names by the parts
            down to it; absent when it has none
          type: string
        childEntries:
          type: array
          items:
            $ref: '#/components/schemas/ContentsEntry'
    Citation:
      type: object
      required:
        - id
        - source
        - author
        - title
        - locations
      properties:
        id:
          type: string
        source:
          type: object
          required:
            - bookId
            - footnoteIdentifier
            - footnotePage
          bookId:
            type: string
          footnoteIdentifier:
            type: string
          footnotePage:
            type: string
        author:
          type: string
        title:
          type: string
        locationsCited:
          type: array
          items:
            type: array
            items: 
              type: object
              properties:
                type:              
                  type: string
                  enum:
                    - page
                    - chapter
                    - book
                    - volume
                    - question
                    - article
                    - lecture
                    - position
                    - verse
                  rawlabel:
                    type: string
                  value:
                    type: number
              

        
